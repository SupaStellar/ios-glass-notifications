<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iOS glass notifications</title>
    <style>
:root {
  color-scheme: dark;
  font-family:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
    "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  margin: 0;
  min-height: 100%;
  height: 100%;
}

body {
  background: #00ff00;
  overflow: hidden;
}

.stage {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 100dvh;
  width: 100%;
  background: #00ff00;
  cursor: pointer;
}

.stack {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  outline: none;
  cursor: pointer;
}

.stack:focus-visible {
  outline: 2px solid rgba(0, 0, 0, 0.35);
  outline-offset: 10px;
  border-radius: 28px;
}

.banner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 22px;
  color: #fff;
  user-select: none;
  background: linear-gradient(
    180deg,
    rgba(255, 255, 255, 0.14) 0%,
    rgba(36, 30, 28, 0.42) 14%,
    rgba(22, 18, 16, 0.5) 100%
  );
  backdrop-filter: blur(28px) saturate(1.7);
  -webkit-backdrop-filter: blur(28px) saturate(1.7);
  border: 0.6px solid rgba(255, 255, 255, 0.2);
  box-shadow:
    0 18px 40px rgba(0, 0, 0, 0.38),
    0 4px 14px rgba(0, 0, 0, 0.28),
    inset 0 0.6px 0 rgba(255, 255, 255, 0.22),
    inset 0.6px 0 0 rgba(255, 255, 255, 0.1);
}

.icon {
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
  display: block;
}

.copy {
  min-width: 0;
  flex: 1;
}

.row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.title {
  margin: 0;
  font-size: 13px;
  font-weight: 650;
  letter-spacing: -0.01em;
  line-height: 1.15;
}

.time {
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.55);
}

.body {
  margin: 2px 0 0;
  font-size: 12.5px;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.2;
  color: rgba(255, 255, 255, 0.94);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

    </style>
  </head>

    <div id="root"></div>
